<!-- CREATE -->
<section class="screen" id="s-create">
  <h2 data-t="createBox"></h2>
  <div class="wprog" id="wProg"><div class="wbar"><i id="wBar"></i></div><span id="wStepTxt"></span></div>
  <!-- step 1: what goes in -->
  <div class="wstep" data-step="1">
    <h3 class="wtitle" data-t="w1T"></h3>
    <p class="sm whint" data-t="w1H"></p>
    <div class="card" id="hookCard"></div>
    <div class="card">
      <div class="lbl" data-t="xahAmount"></div>
      <div class="inpw"><input class="inp" id="amtInput" inputmode="decimal" placeholder="0"><span class="u">XAH</span></div>
      <p class="sm" id="amtNote"></p>
    </div>
    <div class="card">
      <div class="lbl"><span data-t="tokenInside"></span> <span class="sm" data-t="optional"></span></div>
      <div class="tokens" id="giftTokens"></div>
    </div>
    <div class="card" id="gcCard">
      <div class="lbl"><span data-t="gcTitle"></span> <span class="sm" data-t="optional"></span></div>
      <p class="sm" data-t="gcSub"></p>
      <button class="btn o" id="gcToggle" type="button" data-t="gcAdd"></button>
      <div class="gcform hide" id="gcForm">
        <div class="lbl" data-t="gcCodeLbl"></div>
        <textarea class="inp ta" id="gcCode" autocomplete="off" autocapitalize="off" spellcheck="false" data-tp="gcCodePh"></textarea>
        <p class="sm" id="gcLeft"></p>
        <div class="lbl lbl2" data-t="gcPwLbl"></div>
        <input class="inp mono" id="gcPw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-tp="gcPwPh">
        <div class="btn2"><button class="btn w" id="gcGen" type="button" data-t="gcGen"></button><button class="btn o" id="gcCopyPw" type="button" data-t="gcCopyPw"></button></div>
        <p class="sm" id="gcPwNote"></p>
        <div class="card warn" data-t="gcWarn"></div>
        <label class="opt opt2"><input type="checkbox" id="gcSaved"><span><b data-t="gcSaved"></b></span></label>
        <button class="btn y" id="gcMint" type="button" data-t="gcMint"></button>
        <p class="sm" data-t="gcMintSub"></p>
      </div>
    </div>
  </div>
  <!-- step 2: how to give -->
  <div class="wstep" data-step="2">
    <h3 class="wtitle" data-t="w2T"></h3>
    <p class="sm whint" data-t="w2H"></p>
    <div class="card">
      <p class="sm yel hide" id="gcModeHint" data-t="gcModeHint"></p>
      <label class="opt"><input type="radio" name="kind" value="link" checked><span><b data-t="kLink"></b><span data-t="kLinkSub"></span></span></label>
      <div class="sub-in" id="linkWrap">
        <label class="opt opt2"><input type="radio" name="linkFor" value="bearer" checked><span><b data-t="kBearer"></b><span data-t="kBearerSub"></span></span></label>
        <label class="opt opt2"><input type="radio" name="linkFor" value="named"><span><b data-t="kNamed"></b><span data-t="kNamedSub"></span></span></label>
        <div class="hide" id="namedWrap"><input class="inp" id="namedAddr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="r... (recipient)" data-tp="recipientPh"></div>
      </div>
      <label class="opt"><input type="radio" name="kind" value="token"><span><b data-t="kToken"></b><span data-t="kTokenSub"></span></span></label>
      <p class="sm yel hide" id="keyWaitNote"></p>
    </div>
  </div>
  <!-- step 3 (key-token mode only): the key -->
  <div class="wstep" data-step="3">
    <h3 class="wtitle" data-t="w3T"></h3>
    <p class="sm whint" data-t="w3H"></p>
    <div class="card" id="keyWrap">
      <div class="lbl" data-t="pickKey"></div>
      <div class="tokens" id="keyTokens"></div>
      <button class="btn o" id="mintKeyBtn" type="button" data-t="mintKey"></button>
      <p class="sm" data-t="mintKeySub"></p>
    </div>
  </div>
  <!-- step 4: time limit -->
  <div class="wstep" data-step="4">
    <h3 class="wtitle" data-t="w4T"></h3>
    <p class="sm whint" data-t="w4H"></p>
    <div class="card">
      <div class="lbl" data-t="timeLimit"></div>
      <select class="inp" id="expSel">
        <option value="0" data-t="noLimit"></option>
        <option value="1" data-t="d1"></option>
        <option value="7" data-t="d7"></option>
        <option value="30" data-t="d30"></option>
        <option value="90" data-t="d90"></option>
      </select>
      <div class="ledgerbox" id="expNote"></div>
    </div>
  </div>
  <!-- step 5: check and sign -->
  <div class="wstep" data-step="5">
    <h3 class="wtitle" data-t="w5T"></h3>
    <p class="sm whint" data-t="w5H"></p>
    <div class="card sumcard"><div class="row"><span data-t="total"></span><b id="sumText">—</b></div><div id="sumMore"></div></div>
  </div>
  <p class="err-line" id="createErr"></p>
  <div class="foot">
    <button class="btn y hide" id="packBtn" type="button" data-t="buildBox"></button>
    <button class="btn o hide" id="wPrev" type="button" data-t="wPrev"></button><button class="btn y" id="wNext" type="button" data-t="wNext"></button>
  </div>
</section>

    <button class="btn w" id="handBtn" type="button" data-t="buildRemit"></button>
    <div id="handOut"></div>
  </div>
  <div class="card evcard">
    <p class="sm" data-t="evergramHint"></p>
    <a class="btn o" id="evergramDone" target="_blank" rel="noopener noreferrer"><img class="evi" src="img/evergram-logo.png" alt="">Evergram</a>
  </div>
  <div class="foot"><button class="btn o" id="doneFinish" type="button" data-t="finish"></button></div>
</section>
