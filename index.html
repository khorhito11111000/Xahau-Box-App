<html lang="en">
<head>
<meta charset="utf-8">

<body>
<div class="app">
<header class="top">
  <div class="acct"><span class="acctt" id="acctText"></span><span class="acctn"><span id="acctVia"></span><button class="chip net" id="netBtn" type="button"></button></span></div>
  <span class="sp"></span>
  <button class="chip acctbtn" id="acctBtn" type="button"></button>
  <button class="chip gear" id="setBtn" type="button"><span data-t="setBtnT"></span></button>
</header>
<div class="backbar hide" id="backBar"><button class="backbtn" id="backBtn" type="button"><span class="bk" aria-hidden="true">‹</span><span data-t="back"></span></button></div>

<!-- HOME -->
<section class="screen" id="s-home">
  <div class="hero"><img src="img/hero.jpg" alt=""></div>
  <h1 class="center"><span data-t="homeTitle1"></span><br><span class="yel" data-t="homeTitle2"></span></h1>
  <p class="sub center" data-t="homeSub"></p>
  <div class="foot">
    <button class="btn y" id="goCreate" type="button" data-t="createBox"></button>
    <button class="btn o" id="goOpen" type="button" data-t="openBox"></button>
    <button class="btn w hide" id="goInbox" type="button"><span data-t="inboxT"></span> <span class="nbadge hide" id="inboxN"></span></button>
    <p class="sm center" data-t="homeNote"></p>
  </div>
</section>

<!-- ACCOUNT -->
<section class="screen" id="s-account">
  <h2 data-t="connectTitle"></h2>
  <p class="sub" data-t="connectSub"></p>
  <button class="wal" id="xamanBtn" type="button"><span class="ic">X</span><span><b data-t="signIn"></b><span class="sm" id="xamanNote" data-t="xamanNote"></span></span><span class="ar">›</span></button>
  <div class="card">
    <div class="lbl" data-t="addrOnly"></div>
    <input class="inp" id="addrInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="r...">
    <p class="sm" data-t="addrOnlyNote"></p>
    <button class="btn w" id="addrGo" type="button" data-t="continue"></button>
  </div>
  <p class="err-line" id="acctErr"></p>
</section>

<!-- CREATE -->
<section class="screen" id="s-create">
  <h2 data-t="createBox"></h2>
  <div class="wprog" id="wProg"><div class="wbar"><i id="wBar"></i></div><span id="wStepTxt"></span></div>
  <!-- step 1: what goes in -->
  <div class="wstep" data-step="1">
    <h3 class="wtitle" data-t="w1T"></h3>
    <p class="sm whint" data-t="w1H"></p>
    <div class="card" id="hookCard"></div>
    <div class="card">
      <div class="lbl" data-t="xahAmount"></div>
      <div class="inpw"><input class="inp" id="amtInput" inputmode="decimal" placeholder="0"><span class="u">XAH</span></div>
      <p class="sm" id="amtNote"></p>
    </div>
    <div class="card">
      <div class="lbl"><span data-t="tokenInside"></span> <span class="sm" data-t="optional"></span></div>
      <div class="tokens" id="giftTokens"></div>
    </div>
    <div class="card" id="gcCard">
      <div class="lbl"><span data-t="gcTitle"></span> <span class="sm" data-t="optional"></span></div>
      <p class="sm" data-t="gcSub"></p>
      <button class="btn o" id="gcToggle" type="button" data-t="gcAdd"></button>
      <div class="gcform hide" id="gcForm">
        <div class="lbl" data-t="gcCodeLbl"></div>
        <textarea class="inp ta" id="gcCode" autocomplete="off" autocapitalize="off" spellcheck="false" data-tp="gcCodePh"></textarea>
        <p class="sm" id="gcLeft"></p>
        <div class="lbl lbl2" data-t="gcPwLbl"></div>
        <input class="inp mono" id="gcPw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-tp="gcPwPh">
        <div class="btn2"><button class="btn w" id="gcGen" type="button" data-t="gcGen"></button><button class="btn o" id="gcCopyPw" type="button" data-t="gcCopyPw"></button></div>
        <p class="sm" id="gcPwNote"></p>
        <div class="card warn" data-t="gcWarn"></div>
        <label class="opt opt2"><input type="checkbox" id="gcSaved"><span><b data-t="gcSaved"></b></span></label>
        <button class="btn y" id="gcMint" type="button" data-t="gcMint"></button>
        <p class="sm" data-t="gcMintSub"></p>
      </div>
    </div>
  </div>
  <!-- step 2: how to give -->
  <div class="wstep" data-step="2">
    <h3 class="wtitle" data-t="w2T"></h3>
    <p class="sm whint" data-t="w2H"></p>
    <div class="card">
      <p class="sm yel hide" id="gcModeHint" data-t="gcModeHint"></p>
      <label class="opt"><input type="radio" name="kind" value="link" checked><span><b data-t="kLink"></b><span data-t="kLinkSub"></span></span></label>
      <div class="sub-in" id="linkWrap">
        <label class="opt opt2"><input type="radio" name="linkFor" value="bearer" checked><span><b data-t="kBearer"></b><span data-t="kBearerSub"></span></span></label>
        <label class="opt opt2"><input type="radio" name="linkFor" value="named"><span><b data-t="kNamed"></b><span data-t="kNamedSub"></span></span></label>
        <div class="hide" id="namedWrap"><input class="inp" id="namedAddr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="r... (recipient)" data-tp="recipientPh"></div>
      </div>
      <label class="opt"><input type="radio" name="kind" value="token"><span><b data-t="kToken"></b><span data-t="kTokenSub"></span></span></label>
    </div>
  </div>
  <!-- step 3 (key-token mode only): the key -->
  <div class="wstep" data-step="3">
    <h3 class="wtitle" data-t="w3T"></h3>
    <p class="sm whint" data-t="w3H"></p>
    <div class="card" id="keyWrap">
      <div class="lbl" data-t="pickKey"></div>
      <div class="tokens" id="keyTokens"></div>
      <button class="btn o" id="mintKeyBtn" type="button" data-t="mintKey"></button>
      <p class="sm" data-t="mintKeySub"></p>
    </div>
  </div>
  <!-- step 4: time limit -->
  <div class="wstep" data-step="4">
    <h3 class="wtitle" data-t="w4T"></h3>
    <p class="sm whint" data-t="w4H"></p>
    <div class="card">
      <div class="lbl" data-t="timeLimit"></div>
      <select class="inp" id="expSel">
        <option value="0" data-t="noLimit"></option>
        <option value="1" data-t="d1"></option>
        <option value="7" data-t="d7"></option>
        <option value="30" data-t="d30"></option>
        <option value="90" data-t="d90"></option>
      </select>
      <div class="ledgerbox" id="expNote"></div>
    </div>
  </div>
  <!-- step 5: check and sign -->
  <div class="wstep" data-step="5">
    <h3 class="wtitle" data-t="w5T"></h3>
    <p class="sm whint" data-t="w5H"></p>
    <div class="card sumcard"><div class="row"><span data-t="total"></span><b id="sumText">—</b></div><div id="sumMore"></div></div>
  </div>
  <p class="err-line" id="createErr"></p>
  <div class="foot">
    <button class="btn y hide" id="packBtn" type="button" data-t="buildBox"></button>
    <div class="btn2"><button class="btn o" id="wPrev" type="button" data-t="wPrev"></button><button class="btn y" id="wNext" type="button" data-t="wNext"></button></div>
  </div>
</section>

<!-- SIGN (shared) -->
<section class="screen" id="s-sign">
  <h2 id="signTitle"></h2>
  <p class="sub" id="signSub"></p>
  <div id="signBody"></div>
  <p class="err-line" id="signErr"></p>
  <div class="foot">
    <button class="btn y" id="checkBtn" type="button" data-t="checkLedger"></button>
    <button class="btn o" id="signBack" type="button" data-t="back"></button>
  </div>
</section>

<!-- DONE (box sent) -->
<section class="screen" id="s-done">
  <div class="donehead"><h2 data-t="boxReady"></h2><span class="tag lock" data-t="locked"></span></div>
  <div class="boximg"><canvas id="boxCanvas" width="1152" height="1712"></canvas></div>
  <div class="card warn hide" id="bearerWarn" data-t="bearerWarn"></div>
  <div class="card" id="doneInfo"></div>
  <p class="sm whint" id="doneNext"></p>
  <div class="foot">
    <button class="btn y" id="dlBtn" type="button" data-t="download"></button>
    <button class="btn w" id="shareBtn" type="button" data-t="share"></button>
    <div class="btn2"><button class="btn o" id="copyLinkBtn" type="button" data-t="copyLink"></button><button class="btn o" id="shareLinkBtn" type="button" data-t="shareLink"></button></div>
  </div>
  <div class="card hide" id="handKey">
    <h3 class="wtitle" data-t="doneStepKey"></h3>
    <div class="card warn hide" id="gcPwRemind" data-t="doneGcPw"></div>
    <div class="lbl" data-t="handKey"></div>
    <input class="inp" id="handAddr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="r... (recipient)" data-tp="recipientPh">
    <button class="btn w" id="handBtn" type="button" data-t="buildRemit"></button>
    <div id="handOut"></div>
  </div>
  <div class="card evcard">
    <p class="sm" data-t="evergramHint"></p>
    <a class="btn o" id="evergramDone" target="_blank" rel="noopener noreferrer"><img class="evi" src="img/evergram-logo.png" alt="">Evergram</a>
  </div>
  <div class="foot"><button class="btn o" id="doneFinish" type="button" data-t="finish"></button></div>
</section>

<!-- OPEN -->
<section class="screen" id="s-open">
  <h2 data-t="boxForYou"></h2>
  <div class="card" id="openInputCard">
    <div class="lbl" data-t="pasteQr"></div>
    <textarea class="inp ta" id="qrInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="tgs1:... / https://...#tgs1:..."></textarea>
    <div class="row2">
      <button class="btn w" id="qrGo" type="button" data-t="show"></button>
      <button class="btn o" id="scanBtn" type="button" data-t="scan"></button>
      <label class="btn o filebtn"><span data-t="photo"></span><input type="file" id="qrFile" accept="image/*" hidden></label>
    </div>
    <div class="scanbox hide" id="scanBox"><video id="scanVideo" playsinline muted></video><button class="btn o" id="scanStop" type="button" data-t="stop"></button></div>
  </div>
  <div id="boxView"></div>
  <p class="err-line" id="openErr"></p>
</section>

<!-- OPENED -->
<section class="screen" id="s-opened">
  <div class="hero"><img src="img/box_open.jpg" alt=""></div>
  <h1 class="center" data-t="opened"></h1>
  <div class="card" id="openedInfo"></div>
  <div class="foot"><button class="btn y" id="openedHome" type="button" data-t="home"></button></div>
</section>

<!-- GIFT CODES -->
<!-- SETTINGS AND INFO -->
<section class="screen" id="s-settings">
  <h2 data-t="setTitle"></h2>
  <p class="sub" data-t="setSub"></p>
  <details class="acc" id="acc-boxes" name="setacc">
    <summary><span data-t="mbH"></span></summary>
    <div class="accb">
      <div class="tabs" role="tablist" id="mbTabs">
        <button class="tab" type="button" role="tab" data-tab="built"><span data-t="mbBuilt"></span><span class="tn"></span></button>
        <button class="tab" type="button" role="tab" data-tab="recv"><span data-t="mbRecv"></span><span class="tn"></span></button>
        <button class="tab" type="button" role="tab" data-tab="sent"><span data-t="mbSent"></span><span class="tn"></span></button>
      </div>
      <p class="sm" id="mbSub"></p>
      <div class="mblist" id="mbList"></div>
      <div class="vccard hide" id="vcCard">
        <div class="lbl" data-t="takeBackByVc"></div>
        <input class="inp" id="vcInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="VC (64 hex)">
        <button class="btn w" id="vcOpenBtn" type="button" data-t="buildOpen"></button>
      </div>
      <p class="err-line" id="boxesErr"></p>
    </div>
  </details>
  <details class="acc" id="acc-codes" name="setacc">
    <summary><span data-t="myCodes"></span></summary>
    <div class="accb">
      <p class="sm" data-t="gcMineSub"></p>
      <div id="codesList"></div>
      <p class="err-line" id="codesErr"></p>
    </div>
  </details>
  <details class="acc" id="acc-lang" name="setacc">
    <summary><span data-t="setLangH"></span></summary>
    <div class="accb">
      <p class="sm" data-t="setLangT"></p>
      <div class="langlist" id="langList">
        <button class="langopt" type="button" data-lang="en"><b>EN</b> English</button>
        <button class="langopt" type="button" data-lang="es"><b>ES</b> Español</button>
        <button class="langopt" type="button" data-lang="fr"><b>FR</b> Français</button>
        <button class="langopt" type="button" data-lang="ru"><b>RU</b> Русский</button>
        <button class="langopt" type="button" data-lang="de"><b>DE</b> Deutsch</button>
        <button class="langopt" type="button" data-lang="zh"><b>ZH</b> 中文</button>
        <button class="langopt" type="button" data-lang="ja"><b>JA</b> 日本語</button>
      </div>
    </div>
  </details>
  <details class="acc" id="acc-security" name="setacc">
    <summary><span data-t="setSecH"></span></summary>
    <div class="accb seclist">
      <p class="sm" data-t="secIntro"></p>
        <div class="secitem scam"><b data-t="scamH"></b><p data-t="scamT"></p></div>
        <div class="secitem"><b data-t="egH"></b><p data-t="egT"></p></div>
        <div class="secitem"><b data-t="s1h"></b><p data-t="s1t"></p></div>
        <div class="secitem"><b data-t="s2h"></b><p data-t="s2t"></p></div>
        <div class="secitem"><b data-t="s3h"></b><p data-t="s3t"></p></div>
        <div class="secitem"><b data-t="s4h"></b><p data-t="s4t"></p></div>
        <div class="secitem"><b data-t="s5h"></b><p data-t="s5t"></p></div>
        <div class="secitem"><b data-t="s6h"></b><p data-t="s6t"></p></div>
        <div class="secitem"><b data-t="s7h"></b><p data-t="s7t"></p></div>
        <div class="secitem"><b data-t="s8h"></b><p data-t="s8t"></p></div>
        <div class="secitem"><b data-t="s9h"></b><p data-t="s9t"></p></div>
        <div class="secitem"><b data-t="s10h"></b><p data-t="s10t"></p><p class="sec2" data-t="egPwT"></p></div>
      <p class="secbye center" data-t="secBye"></p>
    </div>
  </details>
  <details class="acc" id="acc-about" name="setacc">
    <summary><span data-t="setAboutH"></span></summary>
    <div class="accb seclist">
      <div class="secitem"><b data-t="ab1h"></b><p data-t="ab1t"></p></div>
      <div class="secitem"><b data-t="ab2h"></b><p data-t="ab2t"></p></div>
      <div class="secitem"><b data-t="ab3h"></b><p data-t="ab3t"></p></div>
      <div class="secitem"><b data-t="ab4h"></b><p data-t="ab4t"></p></div>
      <div class="secitem"><b data-t="ab5h"></b><p data-t="ab5t"></p></div>
      <p class="sm"><span data-t="abVer"></span>: <b class="mono" id="pageVer"></b></p>
    </div>
  </details>
  <details class="acc" id="acc-how" name="setacc">
    <summary><span data-t="setHowH"></span></summary>
    <div class="accb seclist">
      <div class="secitem"><b data-t="hw0h"></b><p><span data-t="hw0a"></span> <a class="egpill xnpill" id="xnLink" href="https://xahau.network/" target="_blank" rel="noopener noreferrer">🌐 Xahau Network</a> <span data-t="hw0b"></span></p></div>

      <div class="secitem"><b data-t="hw4h"></b><p data-t="hw4t"></p></div>
      <div class="secitem"><b data-t="hw5h"></b><p data-t="hw5t"></p></div>
      <div class="secitem"><b data-t="hw6h"></b><p data-t="hw6t"></p></div>
      <div class="secitem"><b data-t="hwQh"></b><p data-t="hwQ1"></p><p data-t="hwQ2"></p><p data-t="hwQ3"></p><p data-t="hwQ4"></p></div>
      <div class="secitem"><b data-t="hw7h"></b><p data-t="hw7t"></p></div>
      <div class="secitem"><b data-t="hw8h"></b><p data-t="hw8t"></p></div>
      <div class="secitem"><b data-t="hw9h"></b><p data-t="hw9t"></p></div>

  <details class="acc" id="acc-rules" name="setacc">
    <summary><span data-t="setRulesH"></span></summary>
    <div class="accb">
      <p class="sm" data-t="rulesIntro"></p>
      <ol class="rules">
      <li data-t="r1"></li>
      <li data-t="r2"></li>
      <li data-t="r3"></li>
      <li data-t="r4"></li>
      <li data-t="r5"></li>
      <li data-t="r6"></li>
      <li data-t="r7"></li>
      <li data-t="r8"></li>
      <li data-t="r9"></li>
      </ol>
    </div>
  </details>
  <div class="foot"><button class="btn o" id="setBack" type="button" data-t="back"></button>
    <div class="setout" id="setOut"><p class="sm center" id="setOutTx"></p><button class="btn w" id="setOutBtn" type="button"></button></div></div>

<div class="toast hide" id="toast"></div>

</div>
