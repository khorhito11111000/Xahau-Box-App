<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="XahauCards">
    <defs>
        <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2ee6c5"/>
            <stop offset="1" stop-color="#8f6dff"/>
        </linearGradient>
    </defs>

    <rect width="32" height="32" rx="7" fill="#070b14"/>

    <!-- Two fanned cards, the same gesture as the hero spread. Kept to three
         strokes so the mark still reads at 16 pixels. -->
    <rect x="6" y="7" width="13" height="18" rx="3" fill="none" stroke="#8f6dff"
          stroke-width="2" opacity=".65" transform="rotate(-15 12.5 16)"/>
    <rect x="12" y="6" width="15" height="20" rx="3" fill="none" stroke="url(#edge)" stroke-width="2.4"/>
    <circle cx="19.5" cy="16" r="3.6" fill="none" stroke="#2ee6c5" stroke-width="1.8"/>
</svg>
